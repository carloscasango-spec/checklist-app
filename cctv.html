<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepción de Sistema CCTV</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--surface); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    h1, h2, h3 { color: var(--primary); margin-top: 0; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #475569; }
    .form-group input, .form-group select, .form-group textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
    
    /* Acordeón de Cámaras */
    .camara-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; background: #fff; overflow: hidden; }
    .camara-card summary { padding: 12px 15px; font-weight: bold; cursor: pointer; background: #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .camara-body { padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; border-top: 1px solid var(--border); }
    .full-width { grid-column: 1 / -1; }

    /* Firmas */
    .firmas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .signature-box { border: 1px dashed var(--border); padding: 10px; border-radius: 8px; text-align: center; background: #fafafa; }
    canvas { border: 1px solid var(--border); background: #fff; border-radius: 4px; width: 100%; height: 120px; touch-action: none; }
    
    /* Botones */
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-primary { background: var(--secondary); color: white; }
    .btn-primary:hover { background: var(--primary); }
    .btn-secondary { background: #64748b; color: white; }
    .btn-clear { background: #e2e8f0; color: #334155; font-size: 0.8rem; padding: 4px 8px; margin-top: 5px; }

    /* Tabla Historial */
    .historial-section { margin-top: 40px; border-top: 2px solid var(--border); padding-top: 20px; }
    .tabla-historial { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    .tabla-historial th, .tabla-historial td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .tabla-historial th { background-color: #f1f5f9; color: var(--primary); }
    .tabla-historial tr:nth-child(even) { background-color: #f8fafc; }

    @media (max-width: 600px) {
      .firmas-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>📜 Recepción de Sistema CCTV</h1>
    <div>
      <button id="btn-guardar" class="btn btn-primary" onclick="guardarProgreso()">💾 Guardar</button>
    </div>
  </div>

  <!-- Datos del Proyecto -->
  <div class="grid">
    <div class="form-group">
      <label for="req-proyecto">Nombre del Proyecto *</label>
      <input type="text" id="req-proyecto" placeholder="Ej: Sucursal Centro">
    </div>
    <div class="form-group">
      <label for="req-fecha">Fecha de Inspección</label>
      <input type="date" id="req-fecha">
    </div>
    <div class="form-group">
      <label for="req-tecnico">Técnico Asignado</label>
      <input type="text" id="req-tecnico" placeholder="Nombre del técnico">
    </div>
    <div class="form-group">
      <label for="num-camaras">Cantidad de Cámaras</label>
      <input type="number" id="num-camaras" value="4" min="1" max="64" onchange="generarCamaras()">
    </div>
  </div>

  <!-- Lista de Evaluación de Cámaras -->
  <h2>📹 Evaluación por Cámara</h2>
  <div id="contenedor-camaras"></div>

  <!-- Sección de Firmas -->
  <h2>✍️ Firmas de Conformidad</h2>
  <div class="firmas-grid">
    <div class="signature-box">
      <label>Firma del Técnico</label>
      <canvas id="canvas_tecnico"></canvas>
      <button class="btn btn-clear" onclick="limpiarCanvas('canvas_tecnico')">Limpiar Firma</button>
      <div class="form-group" style="margin-top: 10px;">
        <input type="text" id="nombre_firma_tecnico" placeholder="Nombre completo del técnico">
      </div>
    </div>
    <div class="signature-box">
      <label>Firma del Cliente / Receptor</label>
      <canvas id="canvas_cliente"></canvas>
      <button class="btn btn-clear" onclick="limpiarCanvas('canvas_cliente')">Limpiar Firma</button>
      <div class="form-group" style="margin-top: 10px;">
        <input type="text" id="nombre_firma_cliente" placeholder="Nombre completo del cliente">
      </div>
    </div>
  </div>

  <!-- Historial de Cambios por Usuario -->
  <div class="historial-section">
    <h3>📜 Historial de Cambios por Usuario</h3>
    <table class="tabla-historial">
      <thead>
        <tr>
          <th>Fecha y Hora</th>
          <th>Usuario Autor</th>
          <th>Acción / Detalle</th>
        </tr>
      </thead>
      <tbody id="tabla-historial-body">
        <tr><td colspan="3" style="text-align:center; color:#888;">Sin cambios registrados</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // CONFIGURACIÓN JSONBIN (Reemplazar con tus credenciales)
  const API_KEY = "$2a$10$TU_API_KEY_AQUI"; 
  const BIN_ID = "TU_BIN_ID_AQUI";
  const URL_NUBE = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  let canvasStates = {};

  // Inicialización al cargar la página
  window.onload = () => {
    document.getElementById('req-fecha').valueAsDate = new Date();
    generarCamaras();
    initCanvas('canvas_tecnico');
    initCanvas('canvas_cliente');
  };

  // Obtener usuario autenticado o solicitarlo
  function obtenerUsuarioAutenticado() {
    let user = localStorage.getItem('usuario_actual');
    if (!user) {
      user = prompt("Ingrese su nombre de usuario para continuar:", "Usuario");
      if (!user) user = "Anonimo";
      localStorage.setItem('usuario_actual', user);
    }
    return user;
  }

  // Genera dinámicamente los campos de evaluación por cámara
  function generarCamaras() {
    const contenedor = document.getElementById('contenedor-camaras');
    const total = parseInt(document.getElementById('num-camaras').value) || 1;
    contenedor.innerHTML = '';

    for (let i = 1; i <= total; i++) {
      const details = document.createElement('details');
      details.className = 'camara-card';
      details.open = i === 1; // Abrir la primera por defecto

      details.innerHTML = `
        <summary>Cámara #${i} <span id="tag_summary_${i}" style="font-weight:normal; font-size:0.85rem; color:#64748b;">(Sin ubicación)</span></summary>
        <div class="camara-body">
          <div class="form-group full-width">
            <label>Ubicación / Identificador</label>
            <input type="text" id="cam_ubi_${i}" placeholder="Ej: Entrada Principal / Pasillo B" oninput="actualizarSummary(${i})">
          </div>
          <div class="form-group">
            <label>Montaje / Instalación</label>
            <select id="cam_inst_${i}">
              <option value="">-- Seleccionar --</option>
              <option value="CUMPLE">CUMPLE</option>
              <option value="NO CUMPLE">NO CUMPLE</option>
              <option value="N/A">N/A</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cableado / Conectores</label>
            <select id="cam_cabling_${i}">
              <option value="">-- Seleccionar --</option>
              <option value="CUMPLE">CUMPLE</option>
              <option value="NO CUMPLE">NO CUMPLE</option>
              <option value="N/A">N/A</option>
            </select>
          </div>
          <div class="form-group">
            <label>Etiquetado</label>
            <select id="cam_tag_${i}">
              <option value="">-- Seleccionar --</option>
              <option value="CUMPLE">CUMPLE</option>
              <option value="NO CUMPLE">NO CUMPLE</option>
              <option value="N/A">N/A</option>
            </select>
          </div>
          <div class="form-group">
            <label>Señal de Video</label>
            <select id="cam_video_${i}">
              <option value="">-- Seleccionar --</option>
              <option value="CUMPLE">CUMPLE</option>
              <option value="NO CUMPLE">NO CUMPLE</option>
              <option value="N/A">N/A</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>Observaciones</label>
            <textarea id="cam_obs_${i}" rows="2" placeholder="Detalles o pendientados..."></textarea>
          </div>
        </div>
      `;
      contenedor.appendChild(details);
    }
  }

  function actualizarSummary(index) {
    const val = document.getElementById(`cam_ubi_${index}`).value.trim();
    document.getElementById(`tag_summary_${index}`).innerText = val ? `(${val})` : '(Sin ubicación)';
  }

  // Detecta exactamente qué cambió respecto a la versión previa
  function generarDetalleCambios(previo, actual) {
    if (!previo) {
      return "Creación inicial del reporte de recepción CCTV.";
    }

    const cambios = [];

    if (previo.tecnico !== actual.tecnico && actual.tecnico) {
      cambios.push(`Técnico: "${actual.tecnico}"`);
    }
    if (previo.fecha !== actual.fecha && actual.fecha) {
      cambios.push(`Fecha: ${actual.fecha}`);
    }

    if (!previo.firma_tecnico && actual.firma_tecnico) cambios.push("Añadió firma técnico");
    if (!previo.firma_cliente && actual.firma_cliente) cambios.push("Añadió firma cliente");

    const listaPrevia = previo.camarasLista || [];
    const listaActual = actual.camarasLista || [];

    let resumenCamaras = [];

    listaActual.forEach((camAct, idx) => {
      const camPrev = listaPrevia[idx] || {};
      const tagCamara = camAct.ubicacion ? `Cám #${camAct.num} (${camAct.ubicacion})` : `Cám #${camAct.num}`;
      
      const diffs = [];

      if (camPrev.ubicacion !== camAct.ubicacion && camAct.ubicacion && camPrev.ubicacion) {
        diffs.push(`Ubicación: "${camAct.ubicacion}"`);
      }
      if (camPrev.instalacion !== camAct.instalacion && camAct.instalacion) {
        diffs.push(`Montaje: ${camAct.instalacion}`);
      }
      if (camPrev.cableado !== camAct.cableado && camAct.cableado) {
        diffs.push(`Cableado: ${camAct.cableado}`);
      }
      if (camPrev.etiquetado !== camAct.etiquetado && camAct.etiquetado) {
        diffs.push(`Etiquetado: ${camAct.etiquetado}`);
      }
      if (camPrev.video !== camAct.video && camAct.video) {
        diffs.push(`Video: ${camAct.video}`);
      }
      if (camPrev.obs !== camAct.obs && camAct.obs) {
        diffs.push(`Obs: "${camAct.obs}"`);
      }

      if (diffs.length > 0) {
        resumenCamaras.push(`${tagCamara} [${diffs.join(', ')}]`);
      }
    });

    if (resumenCamaras.length > 0) {
      if (resumenCamaras.length <= 3) {
        cambios.push(resumenCamaras.join('; '));
      } else {
        cambios.push(`${resumenCamaras.length} cámaras actualizadas (${resumenCamaras.slice(0, 2).join('; ')}...)`);
      }
    }

    return cambios.length > 0 ? cambios.join(' | ') : "Guardado/Revisión sin modificaciones detectadas.";
  }

  // Guarda en la nube y registra el detalle en el historial
  async function guardarProgreso() {
    const proyecto = document.getElementById('req-proyecto').value.trim();
    if (!proyecto) { 
      alert("⚠️ Escribe el Nombre del Proyecto para guardar."); 
      return; 
    }

    const usuario = obtenerUsuarioAutenticado();
    const btnGuardar = document.getElementById('btn-guardar');
    btnGuardar.disabled = true;
    btnGuardar.innerHTML = "⏳ Guardando...";

    const camarasData = [];
    const total = document.getElementById('contenedor-camaras').querySelectorAll('details').length;
    
    for (let i = 1; i <= total; i++) {
      camarasData.push({
        num: i,
        ubicacion: document.getElementById(`cam_ubi_${i}`) ? document.getElementById(`cam_ubi_${i}`).value.trim() : '',
        instalacion: document.getElementById(`cam_inst_${i}`) ? document.getElementById(`cam_inst_${i}`).value : '',
        cableado: document.getElementById(`cam_cabling_${i}`) ? document.getElementById(`cam_cabling_${i}`).value : '',
        etiquetado: document.getElementById(`cam_tag_${i}`) ? document.getElementById(`cam_tag_${i}`).value : '',
        video: document.getElementById(`cam_video_${i}`) ? document.getElementById(`cam_video_${i}`).value : '',
        obs: document.getElementById(`cam_obs_${i}`) ? document.getElementById(`cam_obs_${i}`).value.trim() : ''
      });
    }

    const estadoFormulario = {
      proyecto: proyecto,
      fecha: document.getElementById('req-fecha').value,
      tecnico: document.getElementById('req-tecnico').value,
      nombre_tecnico: document.getElementById('nombre_firma_tecnico').value,
      nombre_cliente: document.getElementById('nombre_firma_cliente').value,
      firma_tecnico: canvasStates['canvas_tecnico'] || null,
      firma_cliente: canvasStates['canvas_cliente'] || null,
      camarasLista: camarasData
    };

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      let data = await res.json();
      let proyectos = data.record.proyectos || {};
      
      const versionPrevia = proyectos[`CCTV_${proyecto}`] || null;
      const detalleAccion = generarDetalleCambios(versionPrevia, estadoFormulario);

      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString('es-MX') + ' ' + ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

      let historialPrevio = (versionPrevia && versionPrevia.historial) ? versionPrevia.historial : [];

      const nuevoRegistro = {
        fecha: fechaHoraStr,
        usuario: usuario,
        accion: detalleAccion
      };

      historialPrevio.unshift(nuevoRegistro);

      const estadoFinal = {
        ...estadoFormulario,
        tipo: "RECEPCION_CCTV",
        ultimo_editor: usuario,
        ultima_modificacion: fechaHoraStr,
        historial: historialPrevio
      };

      proyectos[`CCTV_${proyecto}`] = estadoFinal;

      await fetch(URL_NUBE, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ proyectos: proyectos })
      });

      alert(`☁️ Guardado con éxito por ${usuario}.`);
      renderizarHistorial(historialPrevio);

    } catch (err) {
      alert("❌ Error al guardar en el servidor.");
      console.error(err);
    } finally {
      btnGuardar.disabled = false;
      btnGuardar.innerHTML = "💾 Guardar";
    }
  }

  // Carga y muestra los registros del historial en la tabla
  function renderizarHistorial(historialArray) {
    const tbody = document.getElementById('tabla-historial-body');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!historialArray || historialArray.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">Sin cambios registrados</td></tr>`;
      return;
    }

    historialArray.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="white-space: nowrap;">${item.fecha || '-'}</td>
        <td><strong>${item.usuario || 'Desconocido'}</strong></td>
        <td>${item.accion || 'Sin detalle'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Funciones de Dibujo en Canvas para Firmas
  function initCanvas(id) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let dib = false;

    function resize() {
      canvas.width = canvas.parentElement.clientWidth - 20;
      canvas.height = 120;
    }
    resize();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function start(e) { dib = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
    function move(e) {
      if (!dib) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function stop() { 
      if(dib) {
        dib = false; 
        canvasStates[id] = canvas.toDataURL();
      }
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);

    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', stop);
  }

  function limpiarCanvas(id) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    delete canvasStates[id];
  }
</script>

</body>
</html>
