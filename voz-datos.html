<body>

<div id="formato-app">

  <!-- DATOS GENERALES -->
  <div class="card">

      RECEPCIÓN DE VOZ Y DATOS EN TIENDAS Y ESTACIONES

    <div class="form-group">

  <div class="card">

</div>

<script>
  const BIN_ID = "6a906a3af5f4af5e294a7049";
  const API_KEY = "$2a$10$5BDKoNaJb98nczPxrHl1Uuow.tck.XjCTrl6Cc7b.aZ3RbBRtHr4e";
  const URL_NUBE = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  let historialGlobal = [];
  const canvasStates = {};

  // Leer sesión del usuario de forma automática
  function obtenerUsuarioAutenticado() {
    return sessionStorage.getItem("synergo_user") || 
           sessionStorage.getItem("usuario") || 
           localStorage.getItem("synergo_user") || 
           "Usuario Autenticado";
  }

  window.onload = function() {
    document.getElementById('lbl-sesion-usuario').textContent = obtenerUsuarioAutenticado();
    document.getElementById('req-fecha').valueAsDate = new Date();

    generarCamarasPorNumero(null, true);
    cargarProyectosDesdeNube();
    inicializarCanvas('canvas_tecnico');
    inicializarCanvas('canvas_cliente');
  };

  /* --- GENERACIÓN DINÁMICA DE NODOS --- */
  function generarCamarasPorNumero(datosGuardados = null, esLimpiezaTotal = false) {
    const contenedor = document.getElementById('contenedor-nodos');
    const inputCant = document.getElementById('cant-camaras');
    let objetivo = parseInt(inputCant.value) || 1;

    if (objetivo < 1) {
      objetivo = 1;
      inputCant.value = 1;
    }

    if (datosGuardados && Array.isArray(datosGuardados)) {
      objetivo = datosGuardados.length;
      inputCant.value = objetivo;
    }

    const datosPrevios = [];
    if (!esLimpiezaTotal && !datosGuardados) {
      const bloques = contenedor.querySelectorAll('details');
      bloques.forEach((b, idx) => {
        const i = idx + 1;
        datosPrevios.push({
          num: i,
          ubicacion: document.getElementById(`nodo_ubi_${i}`) ? document.getElementById(`nodo_ubi_${i}`).value : '',
          cableado: document.getElementById(`nodo_cabling_${i}`) ? document.getElementById(`nodo_cabling_${i}`).value : '',
          etiquetado: document.getElementById(`nodo_tag_${i}`) ? document.getElementById(`nodo_tag_${i}`).value : '',
          limpieza: document.getElementById(`nodo_clean_${i}`) ? document.getElementById(`nodo_clean_${i}`).value : '',
          pruebas: document.getElementById(`nodo_test_${i}`) ? document.getElementById(`nodo_test_${i}`).value : '',
          obs: document.getElementById(`nodo_obs_${i}`) ? document.getElementById(`nodo_obs_${i}`).value : ''
        });
      });
    }

    contenedor.innerHTML = '';

    for (let i = 1; i <= objetivo; i++) {
      const info = (datosGuardados && datosGuardados[i - 1]) || (datosPrevios[i - 1]) || {};
      crearBloqueNodoHTML(i, info, contenedor);
    }
  }

  function crearBloqueNodoHTML(i, info, contenedor) {
    const details = document.createElement('details');
    details.id = `bloque_nodo_${i}`;
    if (i === 1) details.open = true;

    details.innerHTML = `
      <summary>
        Nodo de Red #${i} <span id="resumen_nodo_${i}" style="font-weight:normal; font-size:11px; color:#666;"></span> <span>▼</span>
      </summary>
      <div style="padding-top: 8px;">
        <div class="form-group">
          <label>Ubicación / Identificador de Nodo:</label>
          <input type="text" id="nodo_ubi_${i}" placeholder="Ej: Nodo Caja 1 / Punto de Venta / AP Pasillo" onchange="actualizarResumen(${i})" value="${info.ubicacion || ''}">
        </div>

        <div class="grid-4" style="margin-top: 6px;">
          <div class="form-group">
            <label>1. Cableado y Peinado</label>
            <select id="nodo_cabling_${i}">
              <option value="">-- Estado --</option>
              <option value="CUMPLE" ${info.cableado === 'CUMPLE' ? 'selected' : ''}>CUMPLE</option>
              <option value="NO CUMPLE" ${info.cableado === 'NO CUMPLE' ? 'selected' : ''}>NO CUMPLE</option>
            </select>
          </div>

          <div class="form-group">
            <label>2. Etiquetado Integral</label>
            <select id="nodo_tag_${i}">
              <option value="">-- Estado --</option>
              <option value="CUMPLE" ${info.etiquetado === 'CUMPLE' ? 'selected' : ''}>CUMPLE</option>
              <option value="NO CUMPLE" ${info.etiquetado === 'NO CUMPLE' ? 'selected' : ''}>NO CUMPLE</option>
            </select>
          </div>

          <div class="form-group">
            <label>3. Limpieza y Acabados</label>
            <select id="nodo_clean_${i}">
              <option value="">-- Estado --</option>
              <option value="CUMPLE" ${info.limpieza === 'CUMPLE' ? 'selected' : ''}>CUMPLE</option>
              <option value="NO CUMPLE" ${info.limpieza === 'NO CUMPLE' ? 'selected' : ''}>NO CUMPLE</option>
            </select>
          </div>

          <div class="form-group">
            <label>4. Pruebas / Mapeo Red</label>
            <select id="nodo_test_${i}">
              <option value="">-- Estado --</option>
              <option value="CUMPLE" ${info.pruebas === 'CUMPLE' ? 'selected' : ''}>CUMPLE</option>
              <option value="NO CUMPLE" ${info.pruebas === 'NO CUMPLE' ? 'selected' : ''}>NO CUMPLE</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Observaciones o Detalle del Nodo:</label>
          <input type="text" id="nodo_obs_${i}" placeholder="Escribir observaciones puntuales..." value="${info.obs || ''}">
        </div>
      </div>
    `;
    contenedor.appendChild(details);
    if (info.ubicacion) actualizarResumen(i);
  }

  /* --- AGREGAR UN NODO EXTRA INDIVIDUAL --- */
  function agregarNodoExtra() {
    const contenedor = document.getElementById('contenedor-nodos');
    const inputCant = document.getElementById('cant-camaras');
    const nuevoTotal = (parseInt(inputCant.value) || contenedor.querySelectorAll('details').length) + 1;
    
    inputCant.value = nuevoTotal;
    crearBloqueNodoHTML(nuevoTotal, {}, contenedor);
    
    const nuevoBloque = document.getElementById(`bloque_nodo_${nuevoTotal}`);
    if (nuevoBloque) nuevoBloque.open = true;
  }

  /* --- BOTÓN DE AUTO-COMPLETAR TODO EN CUMPLE --- */
  function llenarTodoCumple() {
    const total = document.getElementById('contenedor-nodos').querySelectorAll('details').length;
    for (let i = 1; i <= total; i++) {
      if (document.getElementById(`nodo_cabling_${i}`)) document.getElementById(`nodo_cabling_${i}`).value = 'CUMPLE';
      if (document.getElementById(`nodo_tag_${i}`)) document.getElementById(`nodo_tag_${i}`).value = 'CUMPLE';
      if (document.getElementById(`nodo_clean_${i}`)) document.getElementById(`nodo_clean_${i}`).value = 'CUMPLE';
      if (document.getElementById(`nodo_test_${i}`)) document.getElementById(`nodo_test_${i}`).value = 'CUMPLE';
    }
  }

  function actualizarResumen(i) {
    const el = document.getElementById(`nodo_ubi_${i}`);
    if (!el) return;
    const ubi = el.value;
    const span = document.getElementById(`resumen_nodo_${i}`);
    if (span) span.textContent = ubi ? `(${ubi})` : '';
  }

  /* --- COMPARADOR DE CAMBIOS DETALLADO PARA HISTORIAL --- */
  function generarDetalleCambios(previo, actual) {
    if (!previo) {
      // Detalle amplio en creación inicial
      const totalNodos = actual.nodosLista ? actual.nodosLista.length : 0;
      let detalleInicial = `Creación inicial del reporte con ${totalNodos} nodos registrados.`;
      
      const nodosConUbi = (actual.nodosLista || []).filter(n => n.ubicacion);
      if (nodosConUbi.length > 0) {
        detalleInicial += " Nodos configurados: " + nodosConUbi.map(n => `#${n.num} (${n.ubicacion})`).join(", ");
      }
      return detalleInicial;
    }

    const cambios = [];
    if (previo.tecnico !== actual.tecnico && actual.tecnico) cambios.push(`Técnico: "${actual.tecnico}"`);
    if (previo.fecha !== actual.fecha && actual.fecha) cambios.push(`Fecha: ${actual.fecha}`);
    if (!previo.firma_tecnico && actual.firma_tecnico) cambios.push("Añadió firma técnico");
    if (!previo.firma_cliente && actual.firma_cliente) cambios.push("Añadió firma cliente");

    const listaPrevia = previo.nodosLista || [];
    const listaActual = actual.nodosLista || [];

    let resumenNodos = [];

    listaActual.forEach((nodoAct, idx) => {
      const nodoPrev = listaPrevia[idx] || {};
      const tagNodo = nodoAct.ubicacion ? `Nodo #${idx + 1} (${nodoAct.ubicacion})` : `Nodo #${idx + 1}`;
      const diffs = [];

      if (nodoPrev.ubicacion !== nodoAct.ubicacion && nodoAct.ubicacion) diffs.push(`Ubi: "${nodoAct.ubicacion}"`);
      if (nodoPrev.cableado !== nodoAct.cableado && nodoAct.cableado) diffs.push(`Cableado: ${nodoAct.cableado}`);
      if (nodoPrev.etiquetado !== nodoAct.etiquetado && nodoAct.etiquetado) diffs.push(`Etiquetado: ${nodoAct.etiquetado}`);
      if (nodoPrev.limpieza !== nodoAct.limpieza && nodoAct.limpieza) diffs.push(`Limpieza: ${nodoAct.limpieza}`);
      if (nodoPrev.pruebas !== nodoAct.pruebas && nodoAct.pruebas) diffs.push(`Pruebas: ${nodoAct.pruebas}`);
      if (nodoPrev.obs !== nodoAct.obs && nodoAct.obs) diffs.push(`Obs: "${nodoAct.obs}"`);

      if (diffs.length > 0) {
        resumenNodos.push(`${tagNodo}: [${diffs.join(', ')}]`);
      }
    });

    if (resumenNodos.length > 0) {
      cambios.push("Detalle de nodos -> " + resumenNodos.join(' | '));
    }

    return cambios.length > 0 ? cambios.join(' ; ') : "Sin modificaciones de campos respecto a la versión anterior.";
  }

  /* --- SINCRO NUBE Y PROYECTOS --- */
  async function guardarProgreso() {
    const proyecto = document.getElementById('req-proyecto').value.trim();
    if (!proyecto) { alert("⚠️ Escribe el Nombre del Proyecto para guardar."); return; }

    const usuario = obtenerUsuarioAutenticado();
    const btnGuardar = document.getElementById('btn-guardar');
    btnGuardar.disabled = true;
    btnGuardar.innerHTML = "⏳ Guardando...";

    const nodosData = [];
    const total = document.getElementById('contenedor-nodos').querySelectorAll('details').length;
    
    for (let i = 1; i <= total; i++) {
      nodosData.push({
        num: i,
        ubicacion: document.getElementById(`nodo_ubi_${i}`) ? document.getElementById(`nodo_ubi_${i}`).value.trim() : '',
        cableado: document.getElementById(`nodo_cabling_${i}`) ? document.getElementById(`nodo_cabling_${i}`).value : '',
        etiquetado: document.getElementById(`nodo_tag_${i}`) ? document.getElementById(`nodo_tag_${i}`).value : '',
        limpieza: document.getElementById(`nodo_clean_${i}`) ? document.getElementById(`nodo_clean_${i}`).value : '',
        pruebas: document.getElementById(`nodo_test_${i}`) ? document.getElementById(`nodo_test_${i}`).value : '',
        obs: document.getElementById(`nodo_obs_${i}`) ? document.getElementById(`nodo_obs_${i}`).value.trim() : ''
      });
    }

    const estadoFormulario = {
      proyecto: proyecto,
      fecha: document.getElementById('req-fecha').value,
      tecnico: document.getElementById('req-tecnico').value,
      nombre_tecnico: document.getElementById('nombre_firma_tecnico').value,
      nombre_cliente: document.getElementById('nombre_firma_cliente').value,
      firma_tecnico: canvasStates['canvas_tecnico'] || null,
      firma_cliente: canvasStates['canvas_cliente'] || null,
      nodosLista: nodosData
    };

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      let data = await res.json();
      let proyectos = data.record.proyectos || {};

      const versionPrevia = proyectos[`VYD_${proyecto}`] || null;
      const detalleAccion = generarDetalleCambios(versionPrevia, estadoFormulario);

      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString('es-MX') + ' ' + ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

      let historialPrevio = (versionPrevia && versionPrevia.historial) ? versionPrevia.historial : [];
      historialPrevio.unshift({ fecha: fechaHoraStr, usuario: usuario, accion: detalleAccion });

      const estadoFinal = {
        ...estadoFormulario,
        tipo: "RECEPCION_VOZ_DATOS",
        ultimo_editor: usuario,
        ultima_modificacion: fechaHoraStr,
        historial: historialPrevio
      };

      proyectos[`VYD_${proyecto}`] = estadoFinal;

      await fetch(URL_NUBE, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ proyectos: proyectos })
      });

      alert(`☁️ Guardado con éxito por ${usuario}.`);
      await cargarProyectosDesdeNube(`VYD_${proyecto}`);
    } catch (err) {
      alert("❌ Error al guardar en el servidor.");
      console.error(err);
    } finally {
      btnGuardar.disabled = false;
      btnGuardar.innerHTML = "💾 Guardar";
    }
  }

  async function cargarProyectosDesdeNube(seleccionado = '') {
    const select = document.getElementById('select-proyectos');
    select.innerHTML = '<option value="">⏳ Cargando borradores...</option>';

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      let data = await res.json();
      window.proyectosNube = data.record.proyectos || {};

      select.innerHTML = '<option value="">-- Seleccionar Borrador --</option>';
      Object.keys(window.proyectosNube).forEach(clave => {
        let item = window.proyectosNube[clave];
        if (item.tipo === "RECEPCION_VOZ_DATOS" || clave.startsWith("VYD_")) {
          let opt = document.createElement('option');
          opt.value = clave;
          opt.textContent = item.proyecto || clave.replace("VYD_", "");
          if (clave === seleccionado) opt.selected = true;
          select.appendChild(opt);
        }
      });
    } catch (err) {
      select.innerHTML = '<option value="">❌ Error al cargar borradores</option>';
    }
  }

  function cargarProyecto(clave) {
    if (!clave || !window.proyectosNube) return;
    const estado = window.proyectosNube[clave];
    if (!estado) return;

    document.getElementById('req-proyecto').value = estado.proyecto || '';
    document.getElementById('req-fecha').value = estado.fecha || '';
    document.getElementById('req-tecnico').value = estado.tecnico || '';

    historialGlobal = estado.historial || [];
    renderizarTablaHistorial();

    document.getElementById('nombre_firma_tecnico').value = estado.nombre_tecnico || '';
    cargarImagenEnCanvas('canvas_tecnico', estado.firma_tecnico);

    document.getElementById('nombre_firma_cliente').value = estado.nombre_cliente || '';
    cargarImagenEnCanvas('canvas_cliente', estado.firma_cliente);

    if (estado.nodosLista && estado.nodosLista.length > 0) {
      generarCamarasPorNumero(estado.nodosLista, false);
    }
  }

  function renderizarTablaHistorial() {
    const tbody = document.getElementById('tabla-historial-body');
    if (!historialGlobal || historialGlobal.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Sin historial disponible.</td></tr>';
      return;
    }

    tbody.innerHTML = historialGlobal.map(item => `
      <tr>
        <td style="white-space:nowrap;">${item.fecha || '-'}</td>
        <td><strong>${item.usuario || 'Anónimo'}</strong></td>
        <td>${item.accion || 'Edición de datos'}</td>
      </tr>
    `).join('');
  }

  async function eliminarDeNube() {
    const select = document.getElementById('select-proyectos');
    const clave = select.value;
    if (!clave) { alert("⚠️ Selecciona un borrador para eliminar."); return; }

    const nombreMostrar = select.options[select.selectedIndex].text;
    if (!confirm(`🗑️ ¿Deseas eliminar "${nombreMostrar}"?`)) return;

    const btnEliminar = document.getElementById('btn-eliminar');
    btnEliminar.disabled = true;

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      let data = await res.json();
      let proyectos = data.record.proyectos || {};

      if (proyectos[clave]) {
        delete proyectos[clave];
        await fetch(URL_NUBE, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
          body: JSON.stringify({ proyectos: proyectos })
        });
        alert(`🗑️ Eliminado exitosamente.`);
        nuevoProyecto();
        await cargarProyectosDesdeNube();
      }
    } catch (e) {
      alert("⚠️ Error al eliminar.");
    } finally {
      btnEliminar.disabled = false;
    }
  }

  function nuevoProyecto() {
    document.getElementById('req-proyecto').value = '';
    document.getElementById('req-fecha').valueAsDate = new Date();
    document.getElementById('req-tecnico').value = '';

    historialGlobal = [];
    renderizarTablaHistorial();

    document.getElementById('nombre_firma_tecnico').value = '';
    limpiarCanvas('canvas_tecnico');

    document.getElementById('nombre_firma_cliente').value = '';
    limpiarCanvas('canvas_cliente');

    document.getElementById('cant-camaras').value = 24;
    generarCamarasPorNumero(null, true);
    
    document.getElementById('select-proyectos').value = '';
  }

  /* --- CANVAS DE FIRMAS DIGITALES --- */
  function inicializarCanvas(idCanvas) {
    const canvas = document.getElementById(idCanvas);
    const ctx = canvas.getContext('2d');
    let dibujando = false;

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1b365d';

    function obtenerPosicion(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function iniciarDibujo(e) {
      dibujando = true;
      const pos = obtenerPosicion(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function dibujar(e) {
      if (!dibujando) return;
      e.preventDefault();
      const pos = obtenerPosicion(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function detenerDibujo() {
      if (dibujando) {
        dibujando = false;
        canvasStates[idCanvas] = canvas.toDataURL();
      }
    }

    canvas.addEventListener('mousedown', iniciarDibujo);
    canvas.addEventListener('mousemove', dibujar);
    canvas.addEventListener('mouseup', detenerDibujo);
    canvas.addEventListener('mouseleave', detenerDibujo);

    canvas.addEventListener('touchstart', iniciarDibujo);
    canvas.addEventListener('touchmove', dibujar);
    canvas.addEventListener('touchend', detenerDibujo);
  }

  function limpiarCanvas(idCanvas) {
    const canvas = document.getElementById(idCanvas);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    delete canvasStates[idCanvas];
  }

  function cargarImagenEnCanvas(idCanvas, dataUrl) {
    const canvas = document.getElementById(idCanvas);
    const ctx = canvas.getContext('2d');
    limpiarCanvas(idCanvas);

    if (dataUrl) {
      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvasStates[idCanvas] = dataUrl;
      };
      img.src = dataUrl;
    }
  }

  function descargarPDF() {
    const proyecto = document.getElementById('req-proyecto').value.trim();
    if (!proyecto) { alert("⚠️ Asigna un nombre al Proyecto."); return; }

    const elemento = document.getElementById('formato-app');
    document.querySelectorAll('details').forEach(d => d.open = true);

    const opciones = {
      margin: 8,
      filename: `Recepcion_Voz_y_Datos_${proyecto}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
    };

    html2pdf().set(opciones).from(elemento).save().then(() => {
      document.querySelectorAll('details').forEach(d => d.open = false);
    });
  }
</script>
