<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checklist Recepción · Cableado & CCTV</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --navy:#1F3864; --navy-dark:#152747; --blue:#2E75B6; --bg:#EEF1F5;
    --card:#FFFFFF; --border:#DDE3EC; --text:#1C2530; --muted:#6B7686;
    --ok:#1F8A46; --ok-bg:#E3F5EA; --bad:#C4372B; --bad-bg:#FBE7E5; --pending-bg:#F1F3F6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;padding:0 0 84px 0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;}

  header.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;padding:14px 16px;}
  .brand{display:flex;align-items:center;justify-content:space-between;}
  .brand-title{font-weight:700;font-size:16px;}
  .reset-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;}

  .infobox{background:var(--card);margin:12px;border-radius:12px;padding:12px;border:1px solid var(--border);}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .field input{border:1px solid var(--border);border-radius:6px;padding:8px;font-size:13px;}

  .tabbar{display:flex;gap:6px;margin:0 12px 12px;}
  .tab{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .panel{display:none;padding:0 12px;}
  .panel.active{display:block;}

  .section-card,.node-card{background:var(--card);border-radius:10px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;}
  .section-head,.node-head{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#F7F9FC;cursor:pointer;}
  .section-body,.node-body{display:none;padding:12px;}
  .section-card.open .section-body,.node-card.open .node-body{display:block;}

  .item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEF1F5;}
  .seg button{border:none;background:var(--pending-bg);color:var(--muted);font-size:11px;font-weight:700;padding:6px 10px;cursor:pointer;}
  .seg button.si.active{background:var(--ok-bg);color:var(--ok);}
  .seg button.no.active{background:var(--bad-bg);color:var(--bad);}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px;gap:6px;z-index:30;}
  .navbtn{flex:1;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:12px;color:#fff;cursor:pointer;}
  .navbtn.save{background:var(--navy);}
  .navbtn.view{background:var(--blue);}
  .navbtn.export{background:var(--ok);}

  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal-card{background:#fff;border-radius:12px;width:100%;max-width:500px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{background:var(--navy);color:#fff;padding:12px;display:flex;justify-content:space-between;font-weight:700;}
  .modal-body{padding:16px;overflow-y:auto;flex:1;}
  .modal-body pre{background:#F7F9FC;padding:10px;border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-title">Recepción de Cableado & CCTV</div>
    <button type="button" class="reset-btn" id="btnNuevaVisita">Nueva Visita</button>
  </div>
</header>

<div class="infobox">
  <div class="infogrid">
    <div class="field"><label>Estación / GoMart</label><input id="h_estacion" type="text" placeholder="Ej. MIRADOR"></div>
    <div class="field"><label>Responsable</label><input id="h_responsable" type="text" placeholder="Nombre"></div>
    <div class="field"><label>Fecha</label><input id="h_fecha" type="date"></div>
    <div class="field"><label>Hora</label><input id="h_hora" type="time"></div>
  </div>
</div>

<div class="tabbar">
  <button type="button" class="tab active" data-tab="sitio">Sitio <span id="prog_sitio">0%</span></button>
  <button type="button" class="tab" data-tab="voz">Voz/Datos <span id="prog_voz">0%</span></button>
  <button type="button" class="tab" data-tab="cctv">CCTV <span id="prog_cctv">0%</span></button>
</div>

<div class="panel active" id="panel_sitio"></div>
<div class="panel" id="panel_voz"></div>
<div class="panel" id="panel_cctv"></div>

<div class="bottomnav">
  <button type="button" class="navbtn save" id="btnGuardar">💾 Guardar</button>
  <button type="button" class="navbtn view" id="btnVerDatos">🔍 Ver Datos</button>
  <button type="button" class="navbtn export" id="btnExportar">📊 Excel</button>
</div>

<!-- Modal JSON -->
<div class="modal-overlay" id="modalData">
  <div class="modal-card">
    <div class="modal-head">
      <span>Estado del Registro Guardado</span>
      <button type="button" style="background:none;border:none;color:#fff;cursor:pointer;" id="btnCerrarModal">✕</button>
    </div>
    <div class="modal-body">
      <div><strong>Avance Total: </strong><span id="lblAvanceTotal">0%</span></div>
      <hr>
      <div style="font-size:11px;font-weight:700;margin-top:10px;">OBJETO DE DATOS (JSON):</div>
      <pre id="jsonPreview"></pre>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* DATOS ESTRUCTURALES */
const SITIO_SECTIONS = [
  {id:'A', title:'Nodos de red y contactos piso de venta', items:['Canalizaciones TPV', 'Contacto doble NO regulado', 'Voltajes regulados']},
  {id:'B', title:'Nodos de red — equipo administrativo', items:['Canalizaciones datos', 'Repisa 90x60cm']}
];

/* ESTADO GLOBAL */
let STATE = {
  id: '',
  header: {estacion:'', responsable:'', fecha:'', hora:''},
  sitio: {items:{}},
  voz: {nodos:{}},
  cctv: {nodos:{}}
};

/* CONTROLADORES DE ALMACENAMIENTO */
function generarId() {
  return 'chk_' + Date.now();
}

function persistirEstado() {
  if (!STATE.id) STATE.id = generarId();
  
  // Guardar registro actual
  localStorage.setItem(`checklist_data_${STATE.id}`, JSON.stringify(STATE));
  localStorage.setItem('checklist_last_id', STATE.id);
  
  // Actualizar lista general de auditorías
  let index = JSON.parse(localStorage.getItem('checklist_index') || '[]');
  if (!index.includes(STATE.id)) {
    index.push(STATE.id);
    localStorage.setItem('checklist_index', JSON.stringify(index));
  }
}

function cargarEstadoGuardado() {
  const lastId = localStorage.getItem('checklist_last_id');
  if (lastId) {
    const rawData = localStorage.getItem(`checklist_data_${lastId}`);
    if (rawData) STATE = JSON.parse(rawData);
  }
  if (!STATE.id) STATE.id = generarId();
}

/* RENDERIZADO DE INTERFAZ */
function initApp() {
  cargarEstadoGuardado();
  
  // Vincular campos del Header
  const inputs = ['estacion', 'responsable', 'fecha', 'hora'];
  inputs.forEach(f => {
    const el = document.getElementById(`h_${f}`);
    el.value = STATE.header[f] || '';
    el.addEventListener('input', (e) => {
      STATE.header[f] = e.target.value;
      persistirEstado();
    });
  });

  renderSitio();
  actualizarMetricas();
  bindEvents();
}

function renderSitio() {
  const panel = document.getElementById('panel_sitio');
  panel.innerHTML = '';

  SITIO_SECTIONS.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'section-card';
    card.innerHTML = `
      <div class="section-head">
        <span><strong>${sec.id}</strong>. ${sec.title}</span>
      </div>
      <div class="section-body">
        ${sec.items.map((item, i) => {
          const key = sec.id + i;
          const estado = STATE.sitio.items[key] || null;
          return `
            <div class="item-row">
              <span style="font-size:13px;">${item}</span>
              <div class="seg">
                <button type="button" class="si ${estado==='si'?'active':''}" onclick="setEstadoSitio('${key}','si')">SÍ</button>
                <button type="button" class="no ${estado==='no'?'active':''}" onclick="setEstadoSitio('${key}','no')">NO</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    card.querySelector('.section-head').onclick = () => card.classList.toggle('open');
    panel.appendChild(card);
  });
}

window.setEstadoSitio = function(key, val) {
  STATE.sitio.items[key] = STATE.sitio.items[key] === val ? null : val;
  persistirEstado();
  renderSitio();
  actualizarMetricas();
};

function calcularPorcentaje() {
  let totalItems = 0;
  let marcados = 0;

  SITIO_SECTIONS.forEach(sec => {
    sec.items.forEach((_, i) => {
      totalItems++;
      if (STATE.sitio.items[sec.id + i]) marcados++;
    });
  });

  return totalItems > 0 ? Math.round((marcados / totalItems) * 100) : 0;
}

function actualizarMetricas() {
  const pct = calcularPorcentaje();
  document.getElementById('prog_sitio').textContent = pct + '%';
  document.getElementById('lblAvanceTotal').textContent = pct + '%';
}

function bindEvents() {
  // Navegación por Pestañas
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = (e) => {
      e.preventDefault();
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`panel_${tab.dataset.tab}`).classList.add('active');
    };
  });

  // Botones Inferiores
  document.getElementById('btnGuardar').onclick = (e) => {
    e.preventDefault();
    persistirEstado();
    mostrarToast('💾 Avance guardado con éxito');
  };

  document.getElementById('btnVerDatos').onclick = (e) => {
    e.preventDefault();
    persistirEstado();
    document.getElementById('jsonPreview').textContent = JSON.stringify(STATE, null, 2);
    document.getElementById('modalData').classList.add('open');
  };

  document.getElementById('btnCerrarModal').onclick = (e) => {
    e.preventDefault();
    document.getElementById('modalData').classList.remove('open');
  };

  document.getElementById('btnNuevaVisita').onclick = (e) => {
    e.preventDefault();
    if (confirm('¿Deseas crear un nuevo formulario? El progreso actual quedará guardado.')) {
      persistirEstado();
      STATE = { id: generarId(), header: {estacion:'', responsable:'', fecha:'', hora:''}, sitio: {items:{}}, voz: {nodos:{}}, cctv: {nodos:{}} };
      persistirEstado();
      location.reload();
    }
  };

  document.getElementById('btnExportar').onclick = (e) => {
    e.preventDefault();
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet([STATE.header]);
    XLSX.utils.book_append_sheet(wb, ws, "Header");
    XLSX.writeFile(wb, `${STATE.header.estacion || 'Auditoria'}.xlsx`);
  };
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = initApp;
</script>
</body>
</html>
