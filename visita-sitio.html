<script>
  const BIN_ID = "6a906a3af5f4af5e294a7049";
  const API_KEY = "$2a$10$5BDKoNaJb98nczPxrHl1Uuow.tck.XjCTrl6Cc7b.aZ3RbBRtHr4e";
  const URL_NUBE = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  const estructuraAreas = [
    {
      id: "tpv",
      titulo: "🛒 Piso de Venta (TPV)",
      items: [
        { id: "tpv_1", texto: "1. Canalización / Registros" },
        { id: "tpv_2", texto: "2. Contacto Doble NO Regulado" },
        { id: "tpv_3", texto: "3. Voltaje Verificado en Contactos" },
        { id: "tpv_4", texto: "4. Pases en los muebles" }
      ]
    },
    {
      id: "admin",
      titulo: "🏢 Eq. Administrativo",
      items: [
        { id: "admin_1", texto: "1. Canalización / Registros" },
        { id: "admin_2", texto: "2. Contacto Doble NO Regulado" },
        { id: "admin_3", texto: "3. Voltaje Verificado en Contactos" },
        { id: "admin_4", texto: "4. Pases en los muebles" },
        { id: "admin_5", texto: "5. Repisa de 90x60 cm mínimo" },
        { id: "admin_6", texto: "6. Barra de tierra física" }
      ]
    },
    {
      id: "pub",
      titulo: "📢 Publicidad",
      items: [
        { id: "pub_1", texto: "1. Canalización / Registros" },
        { id: "pub_2", texto: "2. Contacto Doble NO Regulado" },
        { id: "pub_3", texto: "3. Voltaje Verificado en Contactos" },
        { id: "pub_7", texto: "7. Caja Estanca (300x250x150)" }
      ]
    },
    {
      id: "torniquete",
      titulo: "🌐 Torniquete / WiFi",
      items: [
        { id: "tor_1", texto: "1. Canalización / Registros" }
      ]
    },
    {
      id: "enlace_sec",
      titulo: "⛽ Enlace Estación (Inspección Física)",
      esEnlace: true,
      items: [
        { id: "enlace_1", texto: "1. Canalización / Cableado de Enlace" },
        { id: "enlace_2", texto: "2. Antena / Módulos de Comunicación" }
      ]
    }
  ];

  let historialGlobal = [];
  let aplicaEnlaceEstacion = false;
  const canvasStates = {};
  const estadoInspeccion = {};
  const detallesEvidencia = {};

  function obtenerUsuarioAutenticado() {
    return sessionStorage.getItem("synergo_user") || 
           sessionStorage.getItem("usuario") || 
           localStorage.getItem("synergo_user") || 
           "Inspector / Usuario";
  }

  // Inicialización asegurada en orden secuencial síncrono
  window.onload = function() {
    // 1. Mostrar usuario inmediatamente
    const usuarioActual = obtenerUsuarioAutenticado();
    document.getElementById('lbl-sesion-usuario').textContent = usuarioActual;

    // 2. Establecer fecha por defecto
    document.getElementById('req-fecha').valueAsDate = new Date();

    // 3. Renderizar interfaz física básica inmediatamente
    renderizarAreas();
    inicializarCanvas('canvas_tecnico');
    inicializarCanvas('canvas_cliente');

    // 4. Intentar cargar datos de la nube sin bloquear la interfaz
    cargarProyectosDesdeNube();
  };

  function toggleEnlaceEstacion(aplica) {
    aplicaEnlaceEstacion = aplica;
    const contenedor = document.getElementById('contenedor-enlace-estacion');
    const msgNoAplica = document.getElementById('msg-no-aplica-enlace');
    const inputs = contenedor.querySelectorAll('.input-enlace');

    if (aplica) {
      contenedor.style.opacity = '1';
      contenedor.style.pointerEvents = 'auto';
      msgNoAplica.style.display = 'none';
      inputs.forEach(i => i.removeAttribute('disabled'));
    } else {
      contenedor.style.opacity = '0.5';
      contenedor.style.pointerEvents = 'none';
      msgNoAplica.style.display = 'block';
      inputs.forEach(i => {
        i.setAttribute('disabled', 'true');
        i.value = '';
      });

      delete estadoInspeccion['enlace_1'];
      delete estadoInspeccion['enlace_2'];
      delete detallesEvidencia['enlace_1'];
      delete detallesEvidencia['enlace_2'];
    }

    renderizarAreas();
  }

  function renderizarAreas() {
    const contenedor = document.getElementById('contenedor-areas');
    if (!contenedor) return;
    contenedor.innerHTML = '';

    estructuraAreas.forEach(area => {
      if (area.esEnlace && !aplicaEnlaceEstacion) return;

      const card = document.createElement('div');
      card.className = 'area-card';

      let itemsHTML = area.items.map(item => {
        const est = estadoInspeccion[item.id] || "CUMPLE";
        estadoInspeccion[item.id] = est;

        detallesEvidencia[item.id] = detallesEvidencia[item.id] || { foto: '', obs: '' };
        const evidencia = detallesEvidencia[item.id];

        const esCumple = (est === 'CUMPLE');
        const esObservacion = (est === 'OBSERVACION');
        const esNoCumple = (est === 'NO CUMPLE');
        const mostrarCaja = esNoCumple || esObservacion;

        return `
          <div class="item-row ${esNoCumple ? 'item-nocumple' : (esObservacion ? 'item-observacion' : 'item-cumple')}" id="row-${item.id}">
            <span class="item-label">${item.texto}</span>
            <div class="status-group" data-item="${item.id}">
              <button type="button" class="btn-status ${esCumple ? 'active-cumple' : ''}" onclick="seleccionarEstado('${item.id}', 'CUMPLE')">CUMPLE</button>
              <button type="button" class="btn-status ${esObservacion ? 'active-observacion' : ''}" onclick="seleccionarEstado('${item.id}', 'OBSERVACION')">OBSERVACIÓN</button>
              <button type="button" class="btn-status ${esNoCumple ? 'active-nocumple' : ''}" onclick="seleccionarEstado('${item.id}', 'NO CUMPLE')">NO CUMPLE</button>
            </div>

            <div class="evidencia-box" id="box-evidencia-${item.id}" style="display: ${mostrarCaja ? 'flex' : 'none'}; border-color: ${esNoCumple ? '#d32f2f' : '#f57c00'};">
              <span style="font-size: 11px; font-weight: bold; color: ${esNoCumple ? '#d32f2f' : '#f57c00'};">
                ${esNoCumple ? '⚠️ Detalle del Incumplimiento:' : '📝 Detalle de la Observación:'}
              </span>
              <input type="text" id="obs-item-${item.id}" placeholder="Escribe tus notas aquí..." value="${evidencia.obs || ''}" onkeyup="guardarObsItem('${item.id}', this.value)" onchange="guardarObsItem('${item.id}', this.value)">
              <span style="font-size: 10px; color: #666; margin-top: 2px;">📷 Adjuntar Foto (Opcional):</span>
              <input type="file" accept="image/*" capture="environment" onchange="capturarFoto(event, '${item.id}')">
              <img id="img-prev-${item.id}" class="evidencia-preview" src="${evidencia.foto || ''}" style="display: ${evidencia.foto ? 'block' : 'none'};">
            </div>
          </div>
        `;
      }).join('');

      card.innerHTML = `
        <div class="area-header" onclick="toggleArea('${area.id}')">
          <span>${area.titulo}</span>
          <span id="icon-${area.id}">▼</span>
        </div>
        <div class="area-body" id="body-${area.id}">
          ${itemsHTML}
        </div>
      `;
      contenedor.appendChild(card);
    });

    calcularAvance();
  }

  function toggleArea(id) {
    const body = document.getElementById(`body-${id}`);
    const icon = document.getElementById(`icon-${id}`);
    if (body.style.display === "none") {
      body.style.display = "flex";
      icon.textContent = "▼";
    } else {
      body.style.display = "none";
      icon.textContent = "▶";
    }
  }

  function seleccionarEstado(itemId, estado) {
    estadoInspeccion[itemId] = estado;
    const row = document.getElementById(`row-${itemId}`);
    const evidenciaBox = document.getElementById(`box-evidencia-${itemId}`);
    const container = document.querySelector(`[data-item="${itemId}"]`);

    if (!container) return;

    const btns = container.querySelectorAll('.btn-status');
    btns.forEach(btn => btn.classList.remove('active-cumple', 'active-nocumple', 'active-observacion'));
    row.classList.remove('item-cumple', 'item-nocumple', 'item-observacion');

    if (estado === 'CUMPLE') {
      btns[0].classList.add('active-cumple');
      row.classList.add('item-cumple');
      if (evidenciaBox) evidenciaBox.style.display = 'none';
    } else if (estado === 'OBSERVACION') {
      btns[1].classList.add('active-observacion');
      row.classList.add('item-observacion');
      if (evidenciaBox) {
        evidenciaBox.style.display = 'flex';
        evidenciaBox.style.borderColor = '#f57c00';
      }
    } else if (estado === 'NO CUMPLE') {
      btns[2].classList.add('active-nocumple');
      row.classList.add('item-nocumple');
      if (evidenciaBox) {
        evidenciaBox.style.display = 'flex';
        evidenciaBox.style.borderColor = '#d32f2f';
      }
    }

    calcularAvance();
  }

  function capturarFoto(e, itemId) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 600;
        let width = img.width;
        let height = img.height;

        if (width > MAX_WIDTH) {
          height = Math.round((height * MAX_WIDTH) / width);
          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrlReducida = canvas.toDataURL('image/jpeg', 0.5);

        detallesEvidencia[itemId] = detallesEvidencia[itemId] || {};
        detallesEvidencia[itemId].foto = dataUrlReducida;

        const imgPrev = document.getElementById(`img-prev-${itemId}`);
        if (imgPrev) {
          imgPrev.src = dataUrlReducida;
          imgPrev.style.display = 'block';
        }
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  function guardarObsItem(itemId, valor) {
    detallesEvidencia[itemId] = detallesEvidencia[itemId] || {};
    detallesEvidencia[itemId].obs = valor;
  }

  function calcularAvance() {
    let cumple = 0;
    let observacion = 0;
    let noCumple = 0;

    const keys = Object.keys(estadoInspeccion);
    const total = keys.length;

    keys.forEach(k => {
      if (estadoInspeccion[k] === 'CUMPLE') cumple++;
      if (estadoInspeccion[k] === 'OBSERVACION') observacion++;
      if (estadoInspeccion[k] === 'NO CUMPLE') noCumple++;
    });

    let evaluados = cumple + observacion + noCumple;
    let porcentaje = total > 0 ? Math.round((evaluados / total) * 100) : 0;

    document.getElementById('cnt-cumple').textContent = cumple;
    document.getElementById('cnt-observacion').textContent = observacion;
    document.getElementById('cnt-nocumple').textContent = noCumple;
    document.getElementById('cnt-pendientes').textContent = total - evaluados;
    
    document.getElementById('lbl-porcentaje-avance').textContent = porcentaje + '%';
    document.getElementById('bar-avance-fill').style.width = porcentaje + '%';

    return { porcentaje, cumple, observacion, noCumple };
  }

  async function guardarProgreso() {
    const proyecto = document.getElementById('req-proyecto').value.trim();
    if (!proyecto) { alert("⚠️ Escribe el Nombre del Proyecto."); return; }

    const usuario = obtenerUsuarioAutenticado();
    const btnGuardar = document.getElementById('btn-guardar');
    btnGuardar.disabled = true;
    btnGuardar.textContent = "⏳ Guardando...";

    const stats = calcularAvance();

    const estadoFormulario = {
      proyecto: proyecto,
      fecha: document.getElementById('req-fecha').value,
      tecnico: document.getElementById('req-tecnico').value,
      aplicaEnlaceEstacion: aplicaEnlaceEstacion,
      enlaceProveedor: document.getElementById('enlace-proveedor').value,
      enlaceIp: document.getElementById('enlace-ip').value,
      estadoInspeccion: estadoInspeccion,
      detallesEvidencia: detallesEvidencia,
      obsMatriz: document.getElementById('obs-matriz').value,
      nombre_tecnico: document.getElementById('nombre_firma_tecnico').value,
      nombre_cliente: document.getElementById('nombre_firma_cliente').value,
      firma_tecnico: canvasStates['canvas_tecnico'] || null,
      firma_cliente: canvasStates['canvas_cliente'] || null,
      avancePorcentaje: stats.porcentaje
    };

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      let data = await res.json();
      let proyectos = (data && data.record && data.record.proyectos) ? data.record.proyectos : {};

      const versionPrevia = proyectos[`VISITA_${proyecto}`] || null;
      let detalleAccion = `Guardado (${stats.porcentaje}% Avance: ${stats.cumple} C, ${stats.observacion} Obs, ${stats.noCumple} NC).`;

      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString('es-MX') + ' ' + ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

      let historialPrevio = (versionPrevia && versionPrevia.historial) ? versionPrevia.historial : [];
      historialPrevio.unshift({ fecha: fechaHoraStr, usuario: usuario, accion: detalleAccion });

      const estadoFinal = {
        ...estadoFormulario,
        tipo: "VISITA_SITIO",
        ultimo_editor: usuario,
        ultima_modificacion: fechaHoraStr,
        historial: historialPrevio
      };

      proyectos[`VISITA_${proyecto}`] = estadoFinal;

      let resPut = await fetch(URL_NUBE, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ proyectos: proyectos })
      });

      if (!resPut.ok) {
        let errData = await resPut.json();
        throw new Error(errData.message || "Error al actualizar la nube.");
      }

      alert(`☁️ Guardado exitosamente.`);
      await cargarProyectosDesdeNube(`VISITA_${proyecto}`);
    } catch (err) {
      alert(`❌ Error al guardar en la nube:\n${err.message}`);
    } finally {
      btnGuardar.disabled = false;
      btnGuardar.textContent = "💾 Guardar";
    }
  }

  async function cargarProyectosDesdeNube(seleccionado = '') {
    const select = document.getElementById('select-proyectos');
    if (!select) return;

    select.innerHTML = '<option value="">⏳ Cargando borradores...</option>';

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      if (!res.ok) throw new Error("Error en la conexión a la base de datos.");
      
      let data = await res.json();
      window.proyectosNube = (data && data.record && data.record.proyectos) ? data.record.proyectos : {};

      select.innerHTML = '<option value="">-- Seleccionar Borrador --</option>';
      let contador = 0;

      Object.keys(window.proyectosNube).forEach(clave => {
        let item = window.proyectosNube[clave];
        if (item && (item.tipo === "VISITA_SITIO" || clave.startsWith("VISITA_"))) {
          let opt = document.createElement('option');
          opt.value = clave;
          opt.textContent = item.proyecto || clave.replace("VISITA_", "");
          if (clave === seleccionado) opt.selected = true;
          select.appendChild(opt);
          contador++;
        }
      });

      if (contador === 0) {
        select.innerHTML = '<option value="">(Sin borradores guardados)</option>';
      }
    } catch (err) {
      console.error("Error al obtener datos:", err);
      select.innerHTML = '<option value="">⚠️ No se pudo conectar a la nube</option>';
    }
  }

  function cargarProyecto(clave) {
    if (!clave || !window.proyectosNube) return;
    const estado = window.proyectosNube[clave];
    if (!estado) return;

    document.getElementById('req-proyecto').value = estado.proyecto || '';
    document.getElementById('req-fecha').value = estado.fecha || '';
    document.getElementById('req-tecnico').value = estado.tecnico || '';
    document.getElementById('obs-matriz').value = estado.obsMatriz || '';

    const chkEnlace = document.getElementById('chk-aplica-enlace');
    chkEnlace.checked = !!estado.aplicaEnlaceEstacion;
    toggleEnlaceEstacion(chkEnlace.checked);

    if (chkEnlace.checked) {
      document.getElementById('enlace-proveedor').value = estado.enlaceProveedor || '';
      document.getElementById('enlace-ip').value = estado.enlaceIp || '';
    }

    Object.keys(estadoInspeccion).forEach(k => delete estadoInspeccion[k]);
    Object.keys(detallesEvidencia).forEach(k => delete detallesEvidencia[k]);

    if (estado.estadoInspeccion) Object.assign(estadoInspeccion, estado.estadoInspeccion);
    if (estado.detallesEvidencia) Object.assign(detallesEvidencia, estado.detallesEvidencia);

    renderizarAreas();

    historialGlobal = estado.historial || [];
    renderizarTablaHistorial();

    document.getElementById('nombre_firma_tecnico').value = estado.nombre_tecnico || '';
    cargarImagenEnCanvas('canvas_tecnico', estado.firma_tecnico);

    document.getElementById('nombre_firma_cliente').value = estado.nombre_cliente || '';
    cargarImagenEnCanvas('canvas_cliente', estado.firma_cliente);
  }

  function renderizarTablaHistorial() {
    const tbody = document.getElementById('tabla-historial-body');
    if (!tbody) return;

    if (!historialGlobal || historialGlobal.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Sin historial.</td></tr>';
      return;
    }

    tbody.innerHTML = historialGlobal.map(item => `
      <tr>
        <td>${item.fecha || '-'}</td>
        <td><strong>${item.usuario || 'Anónimo'}</strong></td>
        <td>${item.accion || 'Edición'}</td>
      </tr>
    `).join('');
  }

  async function eliminarDeNube() {
    const select = document.getElementById('select-proyectos');
    const clave = select.value;
    if (!clave) { alert("⚠️ Selecciona un borrador."); return; }

    if (!confirm("🗑️ ¿Deseas eliminar este borrador?")) return;

    try {
      let res = await fetch(URL_NUBE, { headers: { "X-Master-Key": API_KEY } });
      let data = await res.json();
      let proyectos = (data && data.record && data.record.proyectos) ? data.record.proyectos : {};

      if (proyectos[clave]) {
        delete proyectos[clave];
        await fetch(URL_NUBE, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
          body: JSON.stringify({ proyectos: proyectos })
        });
        alert(`🗑️ Eliminado.`);
        nuevoProyecto();
        await cargarProyectosDesdeNube();
      }
    } catch (e) {
      alert("⚠️ Error al eliminar.");
    }
  }

  function nuevoProyecto() {
    document.getElementById('req-proyecto').value = '';
    document.getElementById('req-fecha').valueAsDate = new Date();
    document.getElementById('req-tecnico').value = '';
    document.getElementById('obs-matriz').value = '';

    const chkEnlace = document.getElementById('chk-aplica-enlace');
    chkEnlace.checked = false;
    toggleEnlaceEstacion(false);

    Object.keys(estadoInspeccion).forEach(k => estadoInspeccion[k] = "CUMPLE");
    Object.keys(detallesEvidencia).forEach(k => delete detallesEvidencia[k]);
    renderizarAreas();

    historialGlobal = [];
    renderizarTablaHistorial();

    limpiarCanvas('canvas_tecnico');
    limpiarCanvas('canvas_cliente');
    document.getElementById('nombre_firma_tecnico').value = '';
    document.getElementById('nombre_firma_cliente').value = '';

    document.getElementById('select-proyectos').value = '';
  }

  function inicializarCanvas(idCanvas) {
    const canvas = document.getElementById(idCanvas);
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    let dibujando = false;

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1b365d';

    function obtenerPosicion(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function iniciarDibujo(e) {
      dibujando = true;
      const pos = obtenerPosicion(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function dibujar(e) {
      if (!dibujando) return;
      e.preventDefault();
      const pos = obtenerPosicion(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function detenerDibujo() {
      if (dibujando) {
        dibujando = false;
        canvasStates[idCanvas] = canvas.toDataURL();
      }
    }

    canvas.addEventListener('mousedown', iniciarDibujo);
    canvas.addEventListener('mousemove', dibujar);
    canvas.addEventListener('mouseup', detenerDibujo);
    canvas.addEventListener('mouseleave', detenerDibujo);

    canvas.addEventListener('touchstart', iniciarDibujo);
    canvas.addEventListener('touchmove', dibujar);
    canvas.addEventListener('touchend', detenerDibujo);
  }

  function limpiarCanvas(idCanvas) {
    const canvas = document.getElementById(idCanvas);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    delete canvasStates[idCanvas];
  }

  function cargarImagenEnCanvas(idCanvas, dataUrl) {
    const canvas = document.getElementById(idCanvas);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    limpiarCanvas(idCanvas);

    if (dataUrl) {
      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvasStates[idCanvas] = dataUrl;
      };
      img.src = dataUrl;
    }
  }

  function descargarPDF() {
    const proyecto = document.getElementById('req-proyecto').value.trim();
    if (!proyecto) { alert("⚠️ Asigna un nombre al Proyecto."); return; }

    const elemento = document.getElementById('formato-app');

    const opciones = {
      margin: 6,
      filename: `Visita_Sitio_${proyecto}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
    };

    html2pdf().set(opciones).from(elemento).save();
  }
</script>
