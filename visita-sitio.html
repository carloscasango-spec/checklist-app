<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Adecuaciones Gomart - Synergo Sistemas</title>
  <script>
    if (sessionStorage.getItem("synergo_auth") !== "true") {
      window.location.href = "login.html";
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 10px; background: #f4f6f9; color: #333; font-size: 13px;
    }
    .top-bar {
      position: sticky; top: 0; background: #1b365d; color: white; padding: 10px;
      border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .top-bar h2 { margin: 0; font-size: 14px; text-transform: uppercase; }
    .btn-action {
      background: #e65100; color: white; border: none; padding: 8px 12px;
      border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px; margin-left: 5px;
    }
    .btn-secondary { background: #4a5568; }
    .btn-logout { background: #d32f2f; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; }
    .header-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .field { display: flex; flex-direction: column; }
    .field label { font-size: 10px; font-weight: bold; color: #555; text-transform: uppercase; margin-bottom: 3px; }
    .field input, .field select, .field textarea {
      padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;
    }
    .section-title {
      background: #1b365d; color: white; padding: 6px 10px; font-size: 12px;
      font-weight: bold; text-transform: uppercase; border-radius: 4px; margin: 15px 0 10px 0;
    }
    .check-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #eee;
    }
    .check-label { flex: 1; padding-right: 10px; }
    .options { display: flex; gap: 8px; }
    .options label { font-size: 11px; cursor: pointer; }
    .status-msg { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; text-align: center; display: none; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>Visita en Sitio</h2>
    <div>
      <button class="btn-action btn-secondary" onclick="window.location.href='index.html'">Menú</button>
      <button class="btn-action" onclick="guardarEnNube()">Guardar</button>
      <button class="btn-action" onclick="generarPDF()">PDF</button>
      <button class="btn-action btn-logout" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>

  <div class="container" id="contenido-pdf">
    <div class="header-info">
      <div class="field">
        <label>Proyecto / Tienda:</label>
        <input type="text" id="proyecto" placeholder="Ej. Gomart Cancún">
      </div>
      <div class="field">
        <label>Fecha:</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label>Atendió (Cliente):</label>
        <input type="text" id="atendio" placeholder="Nombre del encargado">
      </div>
      <div class="field">
        <label>Realizó (Synergo):</label>
        <input type="text" id="realizo" placeholder="Técnico a cargo">
      </div>
    </div>

    <div id="status" class="status-msg"></div>

    <div class="section-title">Checklist de Inspección en Sitio</div>

    <div id="items-container">
      <!-- Generado dinámicamente -->
    </div>

    <div class="section-title">Observaciones Generales</div>
    <div class="field">
      <textarea id="observaciones" rows="4" placeholder="Escribe aquí notas adicionales de la visita..."></textarea>
    </div>
  </div>

<script>
  const BIN_ID = "66f44605e41b4d34e437b7b1"; // Tu Bin ID de JSONBin
  const API_KEY = "$2a$10$wT0XkI3GZ9nJ7GZ6T9P7u.Y9hQ.8yE5gLgU8kU8kU8kU8kU8kU8kU"; // Tu Master Key

  const PUNTOS_INSPECCION = [
    "Estado de acometida eléctrica principal",
    "Espacio disponible en rack / gabinete",
    "Canalización existente y preparaciones",
    "Puntos de fijación para cámaras CCTV",
    "Ubicación de nodos de voz y datos",
    "Condiciones ambientales del site",
    "Verificación de tierra física",
    "Facilidad de paso de cableado estructurado"
  ];

  function inicializarFormulario() {
    document.getElementById('fecha').valueAsDate = new Date();
    const container = document.getElementById('items-container');
    container.innerHTML = '';

    PUNTOS_INSPECCION.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'check-item';
      div.innerHTML = `
        <div class="check-label">${index + 1}. ${item}</div>
        <div class="options">
          <label><input type="radio" name="item_${index}" value="Cumple" checked> Cumple</label>
          <label><input type="radio" name="item_${index}" value="No Cumple"> No Cumple</label>
          <label><input type="radio" name="item_${index}" value="N/A"> N/A</label>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function recopilarDatos() {
    const respuestas = [];
    PUNTOS_INSPECCION.forEach((item, index) => {
      const opcion = document.querySelector(`input[name="item_${index}"]:checked`).value;
      respuestas.push({ punto: item, estado: opcion });
    });

    return {
      modulo: "Visita en Sitio",
      proyecto: document.getElementById('proyecto').value.trim(),
      fecha: document.getElementById('fecha').value,
      atendio: document.getElementById('atendio').value.trim(),
      realizo: document.getElementById('realizo').value.trim(),
      observaciones: document.getElementById('observaciones').value.trim(),
      detalles: respuestas,
      usuario_activo: sessionStorage.getItem("synergo_user") || "desconocido"
    };
  }

  async function guardarEnNube() {
    const datos = recopilarDatos();
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    statusDiv.className = 'status-msg';
    statusDiv.innerText = "Guardando en la nube...";

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify(datos)
      });

      if (response.ok) {
        statusDiv.className = 'status-msg status-success';
        statusDiv.innerText = "✅ Visita guardada exitosamente en la nube.";
      } else {
        throw new Error("Error en el servidor");
      }
    } catch (err) {
      statusDiv.className = 'status-msg status-error';
      statusDiv.innerText = "⚠️ Error al guardar los datos en la nube.";
    }
  }

  function generarPDF() {
    const element = document.getElementById('contenido-pdf');
    const proyecto = document.getElementById('proyecto').value || "Visita";
    const opt = {
      margin: 0.5,
      filename: `Visita_Sitio_${proyecto}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  function cerrarSesion() {
    sessionStorage.removeItem("synergo_auth");
    sessionStorage.removeItem("synergo_user");
    window.location.href = "login.html";
  }

  window.onload = inicializarFormulario;
</script>

</body>
</html>
